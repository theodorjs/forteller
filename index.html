// ─── RESULT BANNER (shared chrome) ────────────────────────────────────────────
function updateResultBanner() {
  const board = activeBoard();
  const banner = document.getElementById('result-banner');
  const shareRow = document.getElementById('share-row');
  const view = activeView();
  banner.innerHTML = '';
  // Fresh results → collapse the split share button back to one circle
  document.getElementById('share-pod').classList.remove('split');

  const spunCats = board.categories.filter(cat => draws[cat.id]?.spun);

  // A view may present results its own way (e.g. the card hand) instead of chips.
  if (view.renderResults) view.renderResults(spunCats);

  if (spunCats.length === 0) {
    banner.classList.remove('show');
    shareRow.classList.remove('show');
    return;
  }

  if (view.ownResults) {
    banner.classList.remove('show');
  } else {
    spunCats.forEach(cat => {
      const idx = draws[cat.id].index;
      const chip = document.createElement('div');
      chip.className = 'result-chip';
      chip.title = 'Klikk for å snurre på nytt';
      chip.innerHTML = `
        <span class="rc-label">${cat.label}</span>
        <span class="rc-value">${cat.items[idx]}</span>
        <span class="rc-respin">↻ snurr på nytt</span>`;
      chip.addEventListener('click', () => {
        if (spinning) return;
        draws[cat.id].spun = false;
        updateResultBanner();
        spinCategory(cat.id);
      });
      banner.appendChild(chip);
    });

    const resetBtn = document.createElement('button');
    resetBtn.className = 'banner-reset-btn';
    resetBtn.textContent = 'Tilbakestill';
    resetBtn.addEventListener('click', resetAll);
    banner.appendChild(resetBtn);

    banner.classList.add('show');
  }

  shareRow.classList.toggle('show', spunCats.length === board.categories.length);
}

// ─── SHARE / SAVE AS IMAGE ────────────────────────────────────────────────────
// Each mode paints its own share image: the wheel's dark stage, the card
// table's green felt, and the map's parchment itinerary.
const SHARE_FONT = "'Segoe UI', system-ui, sans-serif";
const SHARE_HAND_FONT = "'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive";

function makeShareCanvas(W, H, S = 2) {
  const canvas = document.createElement('canvas');
  canvas.width = W * S;
  canvas.height = H * S;
  const ctx = canvas.getContext('2d');
  ctx.scale(S, S);
  return { canvas, ctx };
}

// Word-wrap: returns the drawn lines for a max width (greedy).
function wrapLines(ctx, text, maxW) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = '';
  words.forEach(w => {
    const probe = line ? line + ' ' + w : w;
    if (ctx.measureText(probe).width > maxW && line) { lines.push(line); line = w; }
    else line = probe;
  });
  if (line) lines.push(line);
  return lines;
}

function loadSvgImage(svg) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

const SHARE_PAINTERS = {
  // «hjul»: the original dark stage with gold→accent title and slot rows.
  async hjul(board, cats) {
    const pal = (PALETTES.find(p => p.id === currentPalette) || PALETTES[0]).vars;
    const W = 1200, pad = 90;
    const rowH = 150, rowGap = 28, rowsTop = 210;
    const H = rowsTop + cats.length * rowH + (cats.length - 1) * rowGap + 80;
    const { canvas, ctx } = makeShareCanvas(W, H);

    ctx.fillStyle = pal['--bg'];
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';

    ctx.font = `800 70px ${SHARE_FONT}`;
    const title = 'FORTELLERVERKSTED';
    const tw = ctx.measureText(title).width;
    const grad = ctx.createLinearGradient((W - tw) / 2, 0, (W + tw) / 2, 0);
    grad.addColorStop(0, pal['--gold']);
    grad.addColorStop(1, pal['--accent']);
    ctx.fillStyle = grad;
    ctx.fillText(title, W / 2, 130);

    let y = rowsTop;
    cats.forEach(cat => {
      const value = cat.items[draws[cat.id].index];
      ctx.fillStyle = pal['--card'];
      ctx.strokeStyle = pal['--line'];
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(pad, y, W - pad * 2, rowH, 24);
      ctx.fill();
      ctx.stroke();

      ctx.font = `800 26px ${SHARE_FONT}`;
      ctx.fillStyle = pal['--gold'];
      ctx.fillText(cat.label.toUpperCase(), W / 2, y + 56);

      let size = 46;
      ctx.font = `700 ${size}px ${SHARE_FONT}`;
      const maxW = W - pad * 2 - 80;
      while (ctx.measureText(value).width > maxW && size > 20) {
        size -= 2;
        ctx.font = `700 ${size}px ${SHARE_FONT}`;
      }
      ctx.fillStyle = pal['--text'];
      ctx.fillText(value, W / 2, y + 116);

      y += rowH + rowGap;
    });
    return canvas;
  },

  // «kort»: the hand laid out on green felt, three cards to a row.
  async kort(board, cats) {
    const W = 1200;
    const cardW = 310, cardH = 434, gapX = 40, gapY = 52;
    const perRow = 3;
    const rows = Math.ceil(cats.length / perRow);
    const top = 210;
    const H = top + rows * cardH + (rows - 1) * gapY + 90;
    const { canvas, ctx } = makeShareCanvas(W, H);

    // felt with a soft vignette
    ctx.fillStyle = '#1f4a3c';
    ctx.fillRect(0, 0, W, H);
    const vig = ctx.createRadialGradient(W / 2, H / 2, 120, W / 2, H / 2, Math.max(W, H) * 0.75);
    vig.addColorStop(0, 'rgba(255,255,255,0.06)');
    vig.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = `800 66px ${SHARE_FONT}`;
    ctx.fillStyle = '#f1ece0';
    ctx.fillText('FORTELLERVERKSTED', W / 2, 120);

    // pre-rasterise the category icons
    const icons = await Promise.all(cats.map(cat => {
      const gi = board.categories.indexOf(cat);
      const color = DECK_COLORS[gi % DECK_COLORS.length];
      return loadSvgImage(catIconSvg(cat.id, gi, color, 96));
    }));

    const rnd = i => Math.sin(i * 91.7 + 2.3) * 2.4;   // deterministic tilt, ±2.4°
    cats.forEach((cat, i) => {
      const gi = board.categories.indexOf(cat);
      const color = DECK_COLORS[gi % DECK_COLORS.length];
      const value = cat.items[draws[cat.id].index];
      const row = Math.floor(i / perRow);
      const inRow = Math.min(perRow, cats.length - row * perRow);
      const rowW = inRow * cardW + (inRow - 1) * gapX;
      const cx = (W - rowW) / 2 + (i % perRow) * (cardW + gapX) + cardW / 2;
      const cy = top + row * (cardH + gapY) + cardH / 2;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((rnd(i) * Math.PI) / 180);

      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 26;
      ctx.shadowOffsetY = 12;
      ctx.fillStyle = '#f7f0e1';
      ctx.beginPath();
      ctx.roundRect(-cardW / 2, -cardH / 2, cardW, cardH, 22);
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.strokeStyle = color + '66';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(-cardW / 2 + 15, -cardH / 2 + 15, cardW - 30, cardH - 30, 13);
      ctx.stroke();

      ctx.drawImage(icons[i], -48, -cardH / 2 + 52, 96, 96);

      ctx.font = `800 21px ${SHARE_FONT}`;
      ctx.fillStyle = color;
      wrapLines(ctx, cat.label.toUpperCase(), cardW - 70).forEach((ln, li) => {
        ctx.fillText(ln, 0, -cardH / 2 + 190 + li * 26);
      });

      ctx.font = `700 30px ${SHARE_FONT}`;
      ctx.fillStyle = '#2a2a30';
      const lines = wrapLines(ctx, value, cardW - 64).slice(0, 5);
      const lh = 38;
      const startY = 46 - ((lines.length - 1) * lh) / 2;
      lines.forEach((ln, li) => ctx.fillText(ln, 0, startY + li * lh));

      ctx.restore();
    });
    return canvas;
  },

  // «kart»: a parchment itinerary — dotted route wandering between numbered
  // stops down the page, values in handwriting.
  async kart(board, cats) {
    const W = 1200;
    const stepY = 168, top = 300;
    const H = top + (cats.length - 1) * stepY + 210;
    const { canvas, ctx } = makeShareCanvas(W, H);

    ctx.fillStyle = '#f2e9ce';
    ctx.fillRect(0, 0, W, H);
    // paper speckle
    const rnd = i => { const s = Math.sin(i * 127.1 + 1.3) * 43758.5453; return s - Math.floor(s); };
    ctx.fillStyle = 'rgba(122,90,40,0.07)';
    for (let i = 0; i < 420; i++) {
      ctx.fillRect(rnd(i) * W, rnd(i + 1000) * H, 2.2, 2.2);
    }
    // double map frame
    ctx.strokeStyle = '#8a6b3c';
    ctx.lineWidth = 4;
    ctx.strokeRect(26, 26, W - 52, H - 52);
    ctx.strokeStyle = '#b99a63';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(38, 38, W - 76, H - 76);

    ctx.textAlign = 'center';
    ctx.font = `800 62px Georgia, 'Times New Roman', serif`;
    ctx.fillStyle = '#96611c';
    ctx.fillText('FORTELLERVERKSTED', W / 2, 128);
    ctx.font = `700 30px Georgia, serif`;
    ctx.fillStyle = '#85704a';
    ctx.fillText('~ reiseruten til historien min ~', W / 2, 178);

    // wandering stop positions and the dotted route through them
    const pts = cats.map((_, i) => ({
      x: i % 2 === 0 ? 250 + rnd(i + 7) * 90 : 890 + rnd(i + 7) * 60,
      y: top + i * stepY,
    }));
    if (pts.length > 1) {
      const d = kartView._routeD(pts);
      ctx.strokeStyle = '#8b4a2f';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.setLineDash([1, 17]);
      ctx.stroke(new Path2D(d));
      ctx.setLineDash([]);
    }

    cats.forEach((cat, i) => {
      const p = pts[i];
      const value = cat.items[draws[cat.id].index];
      const leftSide = p.x < W / 2;

      ctx.beginPath();
      ctx.arc(p.x, p.y, 30, 0, Math.PI * 2);
      ctx.fillStyle = '#b5482a';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#7c2d18';
      ctx.stroke();
      ctx.font = `700 28px Georgia, serif`;
      ctx.fillStyle = '#fdf3e0';
      ctx.fillText(String(i + 1), p.x, p.y + 10);

      const tx = leftSide ? p.x + 62 : p.x - 62;
      ctx.textAlign = leftSide ? 'left' : 'right';
      ctx.font = `700 23px Georgia, serif`;
      ctx.fillStyle = '#6b5124';
      ctx.fillText(cat.label.toUpperCase(), tx, p.y - 16);
      ctx.font = `700 33px ${SHARE_HAND_FONT}`;
      ctx.fillStyle = '#46331a';
      wrapLines(ctx, value, 520).slice(0, 3).forEach((ln, li) => {
        ctx.fillText(ln, tx, p.y + 22 + li * 40);
      });
      ctx.textAlign = 'center';
    });

    // small compass rose, bottom-right corner
    const cx = W - 110, cy = H - 110;
    ctx.strokeStyle = '#7a5230';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy, 34, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, cy - 25); ctx.lineTo(cx + 7, cy); ctx.lineTo(cx - 7, cy); ctx.closePath();
    ctx.fillStyle = '#b5482a'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx, cy + 25); ctx.lineTo(cx + 7, cy); ctx.lineTo(cx - 7, cy); ctx.closePath();
    ctx.fillStyle = 'rgba(122,82,48,0.55)'; ctx.fill();
    ctx.font = `700 20px Georgia, serif`;
    ctx.fillStyle = '#7a5230';
    ctx.fillText('N', cx, cy - 44);

    return canvas;
  },
};

async function buildResultImage() {
  const board = activeBoard();
  const cats = board.categories.filter(c => draws[c.id]?.spun);
  if (cats.length === 0) return null;
  const painter = SHARE_PAINTERS[currentView] || SHARE_PAINTERS.hjul;
  return painter(board, cats);
}

function downloadBlob(blob) {
  const a = document.createElement('a');
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = 'fortellerverksted-byggeklosser.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  showToast('Bildet er lagret');
}

const sharePod = document.getElementById('share-pod');

document.getElementById('share-open-btn').addEventListener('click', () => {
  sharePod.classList.add('split');
});

document.getElementById('share-image-btn').addEventListener('click', async () => {
  const canvas = await buildResultImage();
  if (!canvas) return;
  canvas.toBlob(async blob => {
    if (!blob) return;
    const file = new File([blob], 'fortellerverksted-byggeklosser.png', { type: 'image/png' });
    // Use the native share sheet where available (mobile/tablet), otherwise download
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Fortellerverksted' });
        return;
      } catch (e) {
        if (e.name === 'AbortError') return; // user cancelled the share sheet
      }
    }
    downloadBlob(blob);
  }, 'image/png');
});

function lcFirst(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }
function ucFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function buildResultText() {
  const board = activeBoard();

  // «Heltens reise»-boards share as a numbered itinerary instead of the sentence
  // template (the stage order IS the story skeleton).
  if (board.categories.some(c => c.id.startsWith('hj_'))) {
    const lines = board.categories
      .map((c, i) => draws[c.id]?.spun ? `${i + 1}. ${c.label}: ${c.items[draws[c.id].index]}` : null)
      .filter(Boolean);
    return lines.length ? 'Heltens reise – mine byggeklosser:\n' + lines.join('\n') : null;
  }

  const get = id => {
    const cat = board.categories.find(c => c.id === id);
    return cat && draws[cat.id]?.spun ? cat.items[draws[cat.id].index] : null;
  };
  const person = get('person');
  const type = get('type');
  const sted = get('sted');
  const ting = get('ting');
  const tid = get('tid');

  // "på skolen", "på en båt" — men "i skogen", "i en grotte" osv.
  const stedFrase = s => {
    const l = lcFirst(s);
    const paaSteder = ['skolen', 'en båt'];
    return (paaSteder.includes(l.toLowerCase()) ? 'på ' : 'i ') + l;
  };

  const parts = [];
  if (person) parts.push(`Historien min skal handle om ${lcFirst(person)}.`);
  if (type) {
    const t = lcFirst(type);
    const typeFrase = t.toLowerCase() === 'eventyr' ? 'et eventyr' : `en ${t}-historie`;
    parts.push(sted
      ? `Den skal være ${typeFrase}, og den skal foregå ${stedFrase(sted)}.`
      : `Den skal være ${typeFrase}.`);
  } else if (sted) {
    parts.push(`Den skal foregå ${stedFrase(sted)}.`);
  }
  if (ting) {
    parts.push(tid
      ? `${ucFirst(ting)} må dukke opp et eller annet sted i historien, og handlingen skal skje ${lcFirst(tid)}.`
      : `${ucFirst(ting)} må dukke opp et eller annet sted i historien.`);
  } else if (tid) {
    parts.push(`Handlingen skal skje ${lcFirst(tid)}.`);
  }

  // Egendefinerte kategorier utenfor standardmalen listes under
  const standard = ['person', 'type', 'sted', 'ting', 'tid'];
  const extra = board.categories
    .filter(c => !standard.includes(c.id) && draws[c.id]?.spun)
    .map(c => `${c.label}: ${c.items[draws[c.id].index]}`);

  if (parts.length === 0 && extra.length === 0) return null;
  let text = 'Mine byggeklosser:';
  if (parts.length) text += '\n' + parts.join(' ');
  if (extra.length) text += '\n' + extra.join('\n');
  return text;
}

document.getElementById('share-text-btn').addEventListener('click', async () => {
  const text = buildResultText();
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    showToast('Teksten er kopiert');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
    showToast(ok ? 'Teksten er kopiert' : 'Kunne ikke kopiere teksten');
  }
});

// ─── TOOL PANEL ───────────────────────────────────────────────────────────────
const toolPanel = document.getElementById('tool-panel');
const toolToggle = document.getElementById('tool-toggle');
toolToggle.addEventListener('click', () => {
  const open = toolPanel.classList.toggle('open');
  toolToggle.classList.toggle('open', open);
  if (open) renderToolPanel();
});

// Tabs: «Byggeklosser» / «Utseende»
function setToolTab(id) {
  document.querySelectorAll('.tp-tab').forEach(tab => {
    const on = tab.dataset.tab === id;
    tab.classList.toggle('active', on);
    tab.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('.tp-tabpanel').forEach(panel => {
    panel.hidden = panel.dataset.panel !== id;
  });
}
document.querySelectorAll('.tp-tab').forEach(tab => {
  tab.addEventListener('click', () => setToolTab(tab.dataset.tab));
});

function renderToolPanel() {
  renderBoardList();
  renderCatEditor();
  renderPaletteList();
}

// ─── VERSION CHOOSER ──────────────────────────────────────────────────────────
// Catalog of versions shown in the chooser. A version is selectable once a matching
// view exists in VIEWS; otherwise it shows as «Kommer snart».
// Each version carries its own signature colours so its chooser panel shows the
// version's identity (navy / green felt / papyrus), independent of the live palette.
const VERSIONS = [
  { id: 'hjul', name: 'Lykkehjul',   tagline: 'Snurr deg fram', bg: '#1a1a2e', fg: '#e8e8ef', gold: '#f5a623', red: '#e94560', onGold: '#1a1a2e' },
  { id: 'kort', name: 'Spillkort',   tagline: 'Trekk fem kort', bg: '#1f4a3c', fg: '#f1ece0', gold: '#e7c25a', red: '#d65b48', onGold: '#143026' },
  { id: 'kart', name: 'Eventyrkart', tagline: 'Heltens reise steg for steg', bg: '#ece0bd', fg: '#46330f', gold: '#b07d2a', red: '#b5482a', onGold: '#fbf3dd' },
];

// One small, self-contained emblem per version, drawn in that version's colours.
function emblemMarkup(ver) {
  const { gold, red, fg } = ver;
  if (ver.id === 'kort') return `<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-15 40 48)"><rect x="27" y="26" width="22" height="32" rx="4" fill="${fg}" stroke="${gold}" stroke-width="1.5"/></g><g transform="rotate(15 40 48)"><rect x="31" y="26" width="22" height="32" rx="4" fill="${fg}" stroke="${gold}" stroke-width="1.5"/></g><rect x="29" y="21" width="22" height="33" rx="4" fill="${fg}" stroke="${gold}" stroke-width="2"/><text x="40" y="43" text-anchor="middle" font-size="16" fill="${red}" font-family="system-ui, sans-serif">♥</text></svg>`;
  if (ver.id === 'kart') return `<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><circle cx="40" cy="42" r="25" fill="none" stroke="${fg}" stroke-width="2.5"/><circle cx="40" cy="42" r="20" fill="none" stroke="${fg}" stroke-width="1" stroke-dasharray="2 4" opacity="0.45"/><polygon points="40,22 45.5,42 40,42" fill="${red}"/><polygon points="40,22 34.5,42 40,42" fill="${red}" opacity="0.72"/><polygon points="40,62 45.5,42 40,42" fill="${fg}" opacity="0.5"/><polygon points="40,62 34.5,42 40,42" fill="${fg}" opacity="0.3"/><circle cx="40" cy="42" r="3" fill="${gold}"/><text x="40" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="${fg}" font-family="system-ui, sans-serif">N</text></svg>`;
  return `<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><circle cx="40" cy="43" r="25" fill="none" stroke="${gold}" stroke-width="3"/><g stroke="${gold}" stroke-width="2" opacity="0.5"><line x1="40" y1="18" x2="40" y2="68"/><line x1="15" y1="43" x2="65" y2="43"/><line x1="22" y1="25" x2="58" y2="61"/><line x1="58" y1="25" x2="22" y2="61"/></g><circle cx="40" cy="43" r="4.5" fill="${red}"/><polygon points="40,11 34,22 46,22" fill="${red}"/></svg>`;
}

const chooserEl = document.getElementById('chooser');
(() => {
  const foot = document.getElementById('site-footer').cloneNode(true);
  foot.removeAttribute('id');
  foot.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
  document.getElementById('chooser-foot').appendChild(foot);
})();
const chooserRow = document.getElementById('chooser-row');

function renderChooser() {
  chooserRow.innerHTML = '';
  VERSIONS.forEach(ver => {
    const available = VIEWS.some(v => v.id === ver.id);
    const isCurrent = ver.id === currentView;
    const panel = document.createElement('button');
    panel.type = 'button';
    panel.className = 'chooser-panel' + (available ? '' : ' soon') + (isCurrent ? ' current' : '');
    panel.dataset.version = ver.id;
    panel.disabled = !available;
    panel.style.background = ver.bg;
    panel.style.color = ver.fg;
    const foot = !available
      ? `<div class="panel-badge" style="color:${ver.gold};border-color:${ver.gold}">Kommer snart</div>`
      : (isCurrent
          ? `<div class="panel-badge" style="color:${ver.fg};border-color:${ver.fg}">I bruk nå</div>`
          : `<div class="panel-cta" style="background:${ver.gold};color:${ver.onGold}">Velg</div>`);
    panel.innerHTML =
      `<div class="panel-content">` +
      `<div class="panel-emblem">${emblemMarkup(ver)}</div>` +
      `<div class="panel-name">${ver.name}</div>` +
      `<div class="panel-tagline">${ver.tagline}</div>${foot}</div>`;
    if (available) panel.addEventListener('click', () => chooseVersion(ver.id));
    chooserRow.appendChild(panel);
  });
}

function openChooser() {
  renderChooser();
  chooserEl.classList.toggle('dismissable', hasChosen);
  chooserEl.classList.remove('choosing');
  chooserEl.style.opacity = '';
  chooserEl.hidden = false;
  toolPanel.classList.remove('open');
  toolToggle.classList.remove('open');
}

function closeChooser() {
  chooserEl.style.opacity = '0';
  setTimeout(() => {
    chooserEl.hidden = true;
    chooserEl.style.opacity = '';
    chooserEl.classList.remove('choosing');
  }, 320);
}

function chooseVersion(id) {
  const panels = [...chooserRow.children];
  const idx = panels.findIndex(p => p.dataset.version === id);
  if (idx < 0) return;
  panels.forEach((p, i) => {
    if (i < idx) p.classList.add('exit-left');
    else if (i > idx) p.classList.add('exit-right');
    else p.classList.add('chosen');
  });
  chooserEl.classList.add('choosing');

  setTimeout(() => {
    const changed = currentView !== id;
    currentView = id;
    hasChosen = true;
    // The Eventyrkart is the Heltens reise mode: entering it brings its board
    // along (the user can still switch boards freely in the tool panel).
    if (changed && id === 'kart') {
      const hj = boards.find(b => b.id === HJ_BOARD.id);
      if (hj && activeBoardId !== hj.id) {
        activeBoardId = hj.id;
        updateBoardNameDisplay();
        showToast('Byttet til settet «Heltens reise»');
      }
    }
    saveState();
    if (changed) remountView();
    closeChooser();
    cueGear();
  }, 600);
}

// Subtle attention cue: gear spins a couple of turns, then settles.
function cueGear() {
  toolToggle.classList.add('cue');
  toolToggle.addEventListener('animationend', () => toolToggle.classList.remove('cue'), { once: true });
}

document.getElementById('home-btn').addEventListener('click', openChooser);
document.getElementById('chooser-close').addEventListener('click', closeChooser);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !chooserEl.hidden && hasChosen) closeChooser();
});

function renderBoardList() {
  const list = document.getElementById('board-list');
  list.innerHTML = '';
  boards.forEach(board => {
    const item = document.createElement('div');
    item.className = 'board-item' + (board.id === activeBoardId ? ' active' : '');

    const nameSpan = document.createElement('span');
    nameSpan.className = 'board-item-name';
    nameSpan.textContent = board.name;

    item.appendChild(nameSpan);

    if (boards.length > 1) {
      const del = document.createElement('button');
      del.className = 'board-item-del';
      del.textContent = '✕';
      del.title = 'Slett sett';
      let disarmTimer;
      del.addEventListener('click', e => {
        e.stopPropagation();
        if (del.classList.contains('armed')) {
          clearTimeout(disarmTimer);
          deleteBoard(board.id);
        } else {
          del.classList.add('armed');
          del.textContent = 'Slett?';
          disarmTimer = setTimeout(() => {
            del.classList.remove('armed');
            del.textContent = '✕';
          }, 2500);
        }
      });
      item.appendChild(del);
    }

    item.addEventListener('click', () => loadBoard(board.id));
    list.appendChild(item);
  });
}

function renderCatEditor() {
  const editor = document.getElementById('cat-editor');
  editor.innerHTML = '';
  const board = activeBoard();

  board.categories.forEach(cat => {
    const label = document.createElement('div');
    label.className = 'cat-editor-label';
    const labelText = document.createElement('span');
    labelText.textContent = cat.label;
    label.appendChild(labelText);

    // Delete the whole category — same armed two-step pattern as board deletion
    if (board.categories.length > 1) {
      const catDel = document.createElement('button');
      catDel.className = 'cat-del';
      catDel.type = 'button';
      catDel.textContent = '✕';
      catDel.title = 'Fjern kategorien';
      let disarm;
      catDel.addEventListener('click', () => {
        if (catDel.classList.contains('armed')) {
          clearTimeout(disarm);
          board.categories = board.categories.filter(c => c !== cat);
          saveState();
          remountView();
          renderToolPanel();
          showToast(`Kategorien "${cat.label}" er fjernet`);
        } else {
          catDel.classList.add('armed');
          catDel.textContent = 'Fjern?';
          disarm = setTimeout(() => {
            catDel.classList.remove('armed');
            catDel.textContent = '✕';
          }, 2500);
        }
      });
      label.appendChild(catDel);
    }
    editor.appendChild(label);

    const tagList = document.createElement('div');
    tagList.className = 'criteria-tag-list';
    cat.items.forEach((item, idx) => {
      const tag = document.createElement('div');
      tag.className = 'criteria-tag';
      tag.innerHTML = `<span>${item}</span>`;
      const del = document.createElement('button');
      del.textContent = '✕';
      del.title = 'Fjern';
      del.addEventListener('click', () => {
        if (cat.items.length <= 1) { showToast('Minst ett alternativ kreves'); return; }
        cat.items.splice(idx, 1);
        if (draws[cat.id]) { draws[cat.id].index = 0; draws[cat.id].spun = false; }
        saveState();
        activeView().reset(cat.id, 0);
        renderCatEditor();
        updateResultBanner();
      });
      tag.appendChild(del);
      tagList.appendChild(tag);
    });
    editor.appendChild(tagList);

    const addRow = document.createElement('div');
    addRow.className = 'add-row';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'Legg til alternativ…';
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
    const addBtn = document.createElement('button');
    addBtn.textContent = '+ Legg til';
    function addItem() {
      const val = inp.value.trim();
      if (!val) return;
      cat.items.push(val);
      inp.value = '';
      saveState();
      activeView().reset(cat.id, draws[cat.id]?.index || 0);
      renderCatEditor();
    }
    addBtn.addEventListener('click', addItem);
    addRow.appendChild(inp);
    addRow.appendChild(addBtn);
    editor.appendChild(addRow);
  });

  // Add new category
  const divider = document.createElement('div');
  divider.className = 'tp-divider';
  divider.style.marginTop = '8px';
  editor.appendChild(divider);

  const newCatLabel = document.createElement('div');
  newCatLabel.className = 'cat-editor-label';
  newCatLabel.style.marginTop = '8px';
  newCatLabel.textContent = 'Ny kategori';
  editor.appendChild(newCatLabel);

  const newCatRow = document.createElement('div');
  newCatRow.className = 'add-row';
  const newCatInp = document.createElement('input');
  newCatInp.type = 'text';
  newCatInp.placeholder = 'Kategorinavn…';
  newCatInp.addEventListener('keydown', e => { if (e.key === 'Enter') addCat(); });
  const newCatBtn = document.createElement('button');
  newCatBtn.textContent = '+ Ny';
  function addCat() {
    const val = newCatInp.value.trim();
    if (!val) return;
    const id = 'cat_' + Date.now();
    board.categories.push({ id, label: val, items: ['Alternativ 1'] });
    newCatInp.value = '';
    saveState();
    remountView();
    renderToolPanel();
  }
  newCatBtn.addEventListener('click', addCat);
  newCatRow.appendChild(newCatInp);
  newCatRow.appendChild(newCatBtn);
  editor.appendChild(newCatRow);
}

// ─── BOARD MANAGEMENT ─────────────────────────────────────────────────────────
document.getElementById('save-board-btn').addEventListener('click', () => {
  const nameInput = document.getElementById('board-name-input');
  const name = nameInput.value.trim();
  if (!name) { showToast('Skriv inn et navn på settet'); return; }

  const current = activeBoard();
  // Deep-clone categories
  const newBoard = {
    id: 'board_' + Date.now(),
    name,
    categories: JSON.parse(JSON.stringify(current.categories)),
  };
  boards.push(newBoard);
  activeBoardId = newBoard.id;
  nameInput.value = '';
  saveState();
  remountView();
  updateBoardNameDisplay();
  renderToolPanel();
  showToast(`Settet "${name}" er lagret`);
});

document.getElementById('board-name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('save-board-btn').click();
});

function loadBoard(id) {
  if (id === activeBoardId) return;   // don't wipe current draws for a no-op click
  activeBoardId = id;
  saveState();
  remountView();
  updateBoardNameDisplay();
  renderToolPanel();
}

function deleteBoard(id) {
  if (boards.length <= 1) { showToast('Du må ha minst ett sett'); return; }
  const deleted = boards.find(b => b.id === id);
  boards = boards.filter(b => b.id !== id);
  if (activeBoardId === id) activeBoardId = boards[0].id;
  saveState();
  remountView();
  updateBoardNameDisplay();
  renderToolPanel();
  showToast(`Settet "${deleted?.name || ''}" er slettet`);
}

function updateBoardNameDisplay() {
  document.getElementById('board-name-display').textContent = activeBoard().name;
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
applyPalette(currentPalette);
updateBoardNameDisplay();
initDraws();
mountView();
openChooser();   // the chooser IS the start page; first-timers can't dismiss it
</script>
